name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libmagic-dev
      - name: Build package
        run: make deb
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cools-deb
          path: "*.deb"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
